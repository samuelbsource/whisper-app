name: Release

# Builds the CPU, Vulkan and CUDA installers.
#   - Push a tag like v0.1.0: builds all three and creates a DRAFT GitHub release with the installers.
#   - Run manually (Actions tab > Release > Run workflow), or open a pull request that changes the release
#     pipeline: builds all three and keeps them as workflow artifacts only. Nothing is released.
# The release is created as a draft; nothing is published until you do it yourself.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/release.yml
      - scripts/release.ps1
      - scripts/env.ps1
      - src-tauri/Cargo.toml
      - src-tauri/tauri.conf.json

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.backend }})
    runs-on: windows-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        backend: [cpu, vulkan, cuda]
    env:
      LIBCLANG_PATH: C:\Program Files\LLVM\bin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Tag matches the app version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ($env:TAG -ne "v$version") {
            throw "Tag $env:TAG does not match the app version $version in src-tauri/tauri.conf.json"
          }

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable

      # whisper.cpp's Vulkan shader step nests very deep inside the build folder. With the default
      # target dir the paths pass Windows' 260 character limit and MSBuild fails (error FTK1011).
      - name: Use a short build folder
        if: matrix.backend == 'vulkan'
        shell: pwsh
        run: 'Add-Content $env:GITHUB_ENV "CARGO_TARGET_DIR=D:\t"'

      - uses: Swatinem/rust-cache@2201cc584a476d1b508be977bbe4b7d1c7a52e9c # v2.9.3
        with:
          workspaces: src-tauri
          key: ${{ matrix.backend }}

      - name: Install the Vulkan SDK
        if: matrix.backend == 'vulkan'
        uses: jakoch/install-vulkan-sdk-action@7fe84289ddbf750f7eff9f8e4588e600e1dd06c8 # v1.8.1

      - name: Install the CUDA Toolkit
        if: matrix.backend == 'cuda'
        uses: Jimver/cuda-toolkit@b8bf9c6c28f8a92fbb04dcfcaee872e60c57462d # v0.2.36
        with:
          cuda: "13.3.1"
          # Full toolkit: a hand-picked sub-package list missed crt/host_config.h (CUDA 13 moved it).
          # Slower to install, but reliable. Trim it later once the exact package names are known.
          method: network

      - name: Build the installer
        shell: pwsh
        env:
          BACKEND: ${{ matrix.backend }}
        run: |
          if ($env:BACKEND -eq 'cuda') {
            # RTX 20 / GTX 16 (75), RTX 30 (86), RTX 40 (89), RTX 50 (120).
            $env:CMAKE_CUDA_ARCHITECTURES = '75;86;89;120'
          }
          ./scripts/release.ps1 -Backend $env:BACKEND

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer-${{ matrix.backend }}
          path: installers/*.exe
          if-no-files-found: error
          retention-days: 14

  release:
    name: Draft GitHub release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: installer-*
          merge-multiple: true
          path: installers

      - name: Checksums
        run: |
          cd installers
          sha256sum *.exe | tee SHA256SUMS.txt

      - uses: softprops/action-gh-release@28ab305d0ffa26d60ec4bd614126329e26c7a0ec # v3.0.4
        with:
          draft: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            installers/*.exe
            installers/SHA256SUMS.txt
